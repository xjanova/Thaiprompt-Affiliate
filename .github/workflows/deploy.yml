name: Deploy to Production

on:
  # 🔧 (2026-05-26) Direct push trigger — independent of CI
  #   เดิม: workflow_call จาก ci.yml — แต่ CI tests/code-quality ใช้ shivammathur/setup-php
  #   external action ที่ codeload.github.com flaky → CI fail → auto-deploy skip
  #   ใหม่: deploy trigger ตรงจาก push — ไม่พึ่ง CI tests
  #   Safety: deploy.sh มี verify-seeders + composer install + migrate ครอบครุม
  #   Code review ผ่าน PR review ก่อน push
  push:
    branches:
      - claude/Main
      - main

  # Manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

  # Backward compat — ถ้า ci.yml ยังเรียก workflow_call
  workflow_call:

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    # ⏭️ Skip ถ้า commit message มี [skip ci] — เคารพ release bot commits
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Check required secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Required deployment secrets are not configured."
            echo "Please set: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY"
            exit 1
          fi
          echo "✅ All required secrets are configured."
          echo "Deploy path: ${{ vars.DEPLOY_PATH }}"

      # 🔧 (2026-05-26) Inline SSH — แทน appleboy/ssh-action เพื่อหลีกเลี่ยง
      #   GitHub Actions infra issue ที่ download codeload.github.com fail
      #   (เกิดตั้งแต่ 2026-05-08 — auto-deploy ตายเงียบ 18 วัน)
      #   ใช้ openssh ที่ pre-installed ใน ubuntu runner — ไม่พึ่ง external action
      - name: Deploy via SSH (inline — no external action)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_DIR: ${{ vars.DEPLOY_PATH }}
        run: |
          # Setup SSH key
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          echo "🚀 Connecting to $SSH_USER@$SSH_HOST:$SSH_PORT"
          echo "Deploy path: $DEPLOY_DIR"

          # Run deploy.sh on remote — 15min timeout via SSH client option
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=60 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" << EOF
            set -e
            echo "🚀 Starting deployment..."
            cd "$DEPLOY_DIR" || { echo "❌ Cannot cd to $DEPLOY_DIR"; exit 1; }

            if [ -f deploy.sh ]; then
              chmod +x deploy.sh
              bash deploy.sh claude/Main
            else
              echo "❌ deploy.sh not found!"
              exit 1
            fi

            echo "🌱 Running safe seeders..."
            php artisan db:seed --class=AiGenSeeder --force 2>&1 || echo "⚠️ AiGenSeeder skipped"

            echo "✅ Deployment completed!"
          EOF

      - name: Health check
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          echo "Waiting 10s for deployment to settle..."
          sleep 10
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL")
          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 302 ]; then
            echo "✅ Application is healthy (HTTP $HTTP_CODE)"
          else
            echo "⚠️ Health check returned HTTP $HTTP_CODE (may still be starting)"
          fi

      - name: Deployment summary
        if: always()
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $APP_URL" >> $GITHUB_STEP_SUMMARY
