<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a1a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffff"/>
      <stop offset="50%" style="stop-color:#00ccff"/>
      <stop offset="100%" style="stop-color:#0088ff"/>
    </linearGradient>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="100%" style="stop-color:#00ffff"/>
    </linearGradient>
    <linearGradient id="snakeGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6600"/>
      <stop offset="100%" style="stop-color:#ff0066"/>
    </linearGradient>
    <linearGradient id="snakeGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#aa00ff"/>
      <stop offset="100%" style="stop-color:#ff00aa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowText">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.08" stroke="#00ffff" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="40" y1="0" x2="40" y2="630"/>
    <line x1="80" y1="0" x2="80" y2="630"/><line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="160" y1="0" x2="160" y2="630"/><line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="280" y1="0" x2="280" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/><line x1="440" y1="0" x2="440" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="520" y1="0" x2="520" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="640" y1="0" x2="640" y2="630"/><line x1="680" y1="0" x2="680" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="760" y1="0" x2="760" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/><line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/><line x1="920" y1="0" x2="920" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/><line x1="1160" y1="0" x2="1160" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="560" x2="1200" y2="560"/><line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Snake 1 (green/cyan) - main snake curving across -->
  <g filter="url(#glow)">
    <!-- Body segments -->
    <circle cx="180" cy="380" r="14" fill="#00cc88" opacity="0.6"/>
    <circle cx="210" cy="370" r="14" fill="#00cc88" opacity="0.65"/>
    <circle cx="240" cy="355" r="15" fill="#00dd99" opacity="0.7"/>
    <circle cx="270" cy="340" r="15" fill="#00dd99" opacity="0.75"/>
    <circle cx="300" cy="330" r="15" fill="#00eeaa" opacity="0.8"/>
    <circle cx="330" cy="325" r="16" fill="#00eeaa" opacity="0.85"/>
    <circle cx="360" cy="330" r="16" fill="#00ffbb" opacity="0.9"/>
    <circle cx="390" cy="340" r="16" fill="#00ffbb" opacity="0.92"/>
    <circle cx="420" cy="355" r="17" fill="#00ffcc" opacity="0.94"/>
    <circle cx="448" cy="365" r="17" fill="#00ffcc" opacity="0.96"/>
    <circle cx="475" cy="370" r="17" fill="#00ffdd" opacity="0.97"/>
    <circle cx="502" cy="368" r="18" fill="#00ffdd" opacity="0.98"/>
    <circle cx="530" cy="360" r="18" fill="#00ffee"/>
    <!-- Head -->
    <circle cx="558" cy="348" r="20" fill="#00ffff"/>
    <!-- Eyes -->
    <circle cx="565" cy="340" r="5" fill="white"/>
    <circle cx="566" cy="339" r="2.5" fill="#111"/>
    <circle cx="555" cy="338" r="4" fill="white"/>
    <circle cx="556" cy="337" r="2" fill="#111"/>
  </g>

  <!-- Snake 2 (orange/red) - smaller snake -->
  <g filter="url(#glow)">
    <circle cx="850" cy="200" r="10" fill="#ff4400" opacity="0.5"/>
    <circle cx="870" cy="210" r="10" fill="#ff5500" opacity="0.6"/>
    <circle cx="890" cy="225" r="11" fill="#ff6600" opacity="0.7"/>
    <circle cx="905" cy="245" r="11" fill="#ff7700" opacity="0.8"/>
    <circle cx="915" cy="265" r="12" fill="#ff8800" opacity="0.85"/>
    <circle cx="920" cy="288" r="12" fill="#ff9900" opacity="0.9"/>
    <circle cx="918" cy="310" r="13" fill="#ffaa00" opacity="0.95"/>
    <!-- Head -->
    <circle cx="910" cy="332" r="15" fill="#ffbb00"/>
    <circle cx="904" cy="338" r="4" fill="white"/>
    <circle cx="905" cy="339" r="2" fill="#111"/>
    <circle cx="916" cy="336" r="3.5" fill="white"/>
    <circle cx="917" cy="337" r="1.8" fill="#111"/>
  </g>

  <!-- Snake 3 (purple/pink) - small snake -->
  <g filter="url(#glow)">
    <circle cx="700" cy="450" r="8" fill="#9900ff" opacity="0.5"/>
    <circle cx="720" cy="445" r="9" fill="#aa00ff" opacity="0.6"/>
    <circle cx="742" cy="438" r="9" fill="#bb00ff" opacity="0.7"/>
    <circle cx="762" cy="428" r="10" fill="#cc00ff" opacity="0.8"/>
    <circle cx="780" cy="415" r="10" fill="#dd00ee" opacity="0.9"/>
    <!-- Head -->
    <circle cx="796" cy="400" r="12" fill="#ee00dd"/>
    <circle cx="802" cy="395" r="3.5" fill="white"/>
    <circle cx="803" cy="394" r="1.8" fill="#111"/>
    <circle cx="794" cy="393" r="3" fill="white"/>
    <circle cx="795" cy="392" r="1.5" fill="#111"/>
  </g>

  <!-- Food items scattered -->
  <g filter="url(#glow)">
    <circle cx="650" cy="300" r="6" fill="#ff0066"/>
    <circle cx="350" cy="200" r="5" fill="#00ff66"/>
    <circle cx="800" cy="480" r="6" fill="#ffff00"/>
    <circle cx="450" cy="150" r="5" fill="#ff00ff"/>
    <circle cx="1000" cy="350" r="6" fill="#00ffff"/>
    <circle cx="150" cy="250" r="5" fill="#ff6600"/>
    <circle cx="550" cy="480" r="5" fill="#66ff00"/>
    <circle cx="950" cy="180" r="6" fill="#ff0099"/>
    <circle cx="300" cy="500" r="5" fill="#00ff99"/>
    <circle cx="1050" cy="250" r="5" fill="#ffcc00"/>
    <circle cx="100" cy="150" r="4" fill="#ff3366"/>
    <circle cx="680" cy="160" r="5" fill="#33ff99"/>
    <circle cx="1100" cy="450" r="5" fill="#ff66cc"/>
    <circle cx="480" cy="520" r="4" fill="#66ccff"/>
  </g>

  <!-- Power-up items -->
  <g filter="url(#glowStrong)">
    <!-- Magnet -->
    <rect x="250" y="140" width="20" height="20" rx="4" fill="#ff00ff" opacity="0.9"/>
    <text x="260" y="156" text-anchor="middle" font-size="14" fill="white">M</text>
    <!-- Speed -->
    <rect x="750" y="120" width="20" height="20" rx="4" fill="#ffff00" opacity="0.9"/>
    <text x="760" y="136" text-anchor="middle" font-size="14" fill="#333">S</text>
  </g>

  <!-- Title text -->
  <g filter="url(#glowText)">
    <text x="600" y="140" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="92" fill="url(#neon)" letter-spacing="6">
      SNAKE.IO
    </text>
  </g>

  <!-- Subtitle -->
  <text x="600" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="28" fill="#ffffff" opacity="0.9" letter-spacing="8">
    MULTIPLAYER ONLINE
  </text>

  <!-- Bottom bar -->
  <rect x="0" y="570" width="1200" height="60" fill="rgba(0,0,0,0.6)"/>
  <text x="600" y="607" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="22" fill="#00ffff" letter-spacing="2">
    THAI PROMPT GAMES  |  PLAY FREE NOW
  </text>

  <!-- Decorative border glow -->
  <rect x="3" y="3" width="1194" height="624" rx="8" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.3"/>
  <rect x="8" y="8" width="1184" height="614" rx="6" fill="none" stroke="url(#neon)" stroke-width="1" opacity="0.15"/>

  <!-- Online badge -->
  <g transform="translate(1020, 25)">
    <rect x="0" y="0" width="150" height="40" rx="20" fill="rgba(0,255,100,0.2)" stroke="#00ff66" stroke-width="1.5"/>
    <circle cx="22" cy="20" r="6" fill="#00ff66"/>
    <text x="82" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="15" fill="#00ff66">ONLINE</text>
  </g>

  <!-- Player count badge -->
  <g transform="translate(30, 25)">
    <rect x="0" y="0" width="130" height="40" rx="20" fill="rgba(0,200,255,0.15)" stroke="#00ccff" stroke-width="1.5"/>
    <text x="65" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="15" fill="#00ccff">MULTIPLAYER</text>
  </g>
</svg>
