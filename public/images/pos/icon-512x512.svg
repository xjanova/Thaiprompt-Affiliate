<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- POS Terminal Body -->
  <rect x="100" y="80" width="312" height="352" rx="30" fill="white" opacity="0.95"/>

  <!-- Screen -->
  <rect x="130" y="110" width="252" height="160" rx="15" fill="url(#screen)"/>

  <!-- Screen Content - Total -->
  <text x="256" y="175" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#22c55e" text-anchor="middle">฿ 1,234.00</text>
  <text x="256" y="210" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">รวมสุทธิ</text>

  <!-- Screen Lines -->
  <line x1="150" y1="230" x2="362" y2="230" stroke="#374151" stroke-width="1"/>
  <rect x="150" y="240" width="120" height="8" rx="4" fill="#374151"/>
  <rect x="290" y="240" width="50" height="8" rx="4" fill="#22c55e"/>
  <rect x="150" y="255" width="100" height="8" rx="4" fill="#374151"/>
  <rect x="300" y="255" width="40" height="8" rx="4" fill="#22c55e"/>

  <!-- Keypad -->
  <g fill="#e5e7eb">
    <!-- Row 1 -->
    <rect x="130" y="290" width="60" height="40" rx="8"/>
    <rect x="200" y="290" width="60" height="40" rx="8"/>
    <rect x="270" y="290" width="60" height="40" rx="8"/>
    <rect x="340" y="290" width="42" height="40" rx="8" fill="#22c55e"/>

    <!-- Row 2 -->
    <rect x="130" y="340" width="60" height="40" rx="8"/>
    <rect x="200" y="340" width="60" height="40" rx="8"/>
    <rect x="270" y="340" width="60" height="40" rx="8"/>
    <rect x="340" y="340" width="42" height="40" rx="8" fill="#22c55e"/>

    <!-- Row 3 -->
    <rect x="130" y="390" width="130" height="30" rx="8"/>
    <rect x="270" y="390" width="60" height="30" rx="8"/>
    <rect x="340" y="390" width="42" height="30" rx="8" fill="#3b82f6"/>
  </g>

  <!-- Keypad Numbers -->
  <g font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">
    <text x="160" y="318">1</text>
    <text x="230" y="318">2</text>
    <text x="300" y="318">3</text>
    <text x="361" y="318" fill="white">+</text>

    <text x="160" y="368">4</text>
    <text x="230" y="368">5</text>
    <text x="300" y="368">6</text>
    <text x="361" y="368" fill="white">-</text>

    <text x="195" y="412">0</text>
    <text x="300" y="412">.</text>
    <text x="361" y="412" fill="white">⏎</text>
  </g>

  <!-- Card Reader Slot -->
  <rect x="400" y="150" width="15" height="80" rx="3" fill="#d1d5db"/>
  <rect x="402" y="160" width="11" height="60" rx="2" fill="#9ca3af"/>

  <!-- Receipt Slot -->
  <rect x="170" y="72" width="172" height="20" rx="5" fill="#e5e7eb"/>
  <rect x="180" y="65" width="152" height="15" rx="3" fill="#f3f4f6"/>

  <!-- Status LED -->
  <circle cx="140" y="90" r="5" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
