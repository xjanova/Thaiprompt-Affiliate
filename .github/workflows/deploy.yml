name: Deploy to Production

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
  # Auto-trigger when called from ci.yml
  workflow_call:

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Required deployment secrets are not configured."
            echo "Please set: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY"
            exit 1
          fi
          echo "✅ All required secrets are configured."
          echo "Deploy path: ${{ vars.DEPLOY_PATH }}"

      - name: Deploy via SSH (run deploy.sh on server)
        # 🔧 (2026-05-26) Pin exact v1.2.5 — @v1 mutable tag resolved to deleted SHA
        #   0ff4204d59e8e51228ff73bce53f80d53301dee2 → 404 since 2026-05-08
        #   → auto-deploy dead 18 days. Latest stable = v1.2.5 (Jan 2026)
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 15m
          envs: DEPLOY_DIR
          script: |
            echo "🚀 Starting deployment..."
            echo "Deploy path: $DEPLOY_DIR"

            cd "$DEPLOY_DIR" || {
              echo "❌ Cannot cd to $DEPLOY_DIR"
              exit 1
            }

            # Run deploy.sh (it handles git pull, composer, npm, migrate, cache)
            if [ -f deploy.sh ]; then
              chmod +x deploy.sh
              bash deploy.sh claude/Main
            else
              echo "❌ deploy.sh not found!"
              exit 1
            fi

            # Run safe seeders (updateOrCreate pattern - idempotent)
            echo "🌱 Running safe seeders..."
            php artisan db:seed --class=AiGenSeeder --force 2>&1 || echo "⚠️ AiGenSeeder skipped"

            echo "✅ Deployment completed!"

      - name: Health check
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          echo "Waiting 10s for deployment to settle..."
          sleep 10
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL")
          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 302 ]; then
            echo "✅ Application is healthy (HTTP $HTTP_CODE)"
          else
            echo "⚠️ Health check returned HTTP $HTTP_CODE (may still be starting)"
          fi

      - name: Deployment summary
        if: always()
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $APP_URL" >> $GITHUB_STEP_SUMMARY
