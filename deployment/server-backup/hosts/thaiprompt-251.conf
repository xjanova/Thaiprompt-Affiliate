# ค่าของเครื่อง 123.253.62.251 (DirectAdmin — main.thaiprompt.online และเว็บทั้งหมด)
# install.sh ต่อท้ายไฟล์นี้ด้วย R2_ACCOUNT_ID แล้ววางเป็น /etc/server-backup-r2/r2.conf
# ค่าที่ไม่ได้ตั้งที่นี่ = ค่าเริ่มต้นในหัว server-backup-r2.sh

HOST_PROFILE="directadmin"
R2_BUCKET="thaiprompt-backup"
R2_PREFIX="server-123-253-62-251"

# ทุกคืน: ทุกฐานข้อมูล + สภาพเครื่อง · วันที่ 10/25 เพิ่ม: ทุกเว็บ + home ผู้ใช้ (mail, สคริปต์, งานที่อยู่นอกเว็บ)
NIGHTLY_COMPONENTS="db system"
FULL_COMPONENTS="sites homes"
FULL_DAYS="10 25"

MYSQL_DEFAULTS="/usr/local/directadmin/conf/my.cnf"

# สภาพเครื่อง: นอกจาก /etc (เก็บทั้งก้อนเสมอ)
#  - DirectAdmin: conf (รหัส da_admin), data (ผู้ใช้/โดเมน/SSL/DNS), ตัวเลือก custombuild + ของที่แก้เอง, plugin csf
#  - php.ini ที่แก้เอง, cron ของทุกผู้ใช้, สคริปต์ใน /usr/local, home ของ root, งานใน /opt
#  ไม่เก็บ: custombuild ทั้งก้อน (8 GB ซอร์ส/ไฟล์ build — build ใหม่ได้), /opt/android-sdk (2.7 GB ติดตั้งใหม่ได้)
SYSTEM_PATHS=(
  root
  var/spool/cron
  usr/local/bin usr/local/sbin usr/local/lib
  usr/local/directadmin/conf
  usr/local/directadmin/data
  usr/local/directadmin/plugins
  usr/local/directadmin/scripts/custom
  usr/local/directadmin/custombuild/options.conf
  usr/local/directadmin/custombuild/php_extensions.conf
  usr/local/directadmin/custombuild/custom
  'usr/local/php*/lib/php.conf.d'
  opt/n8n opt/xcluadeagent opt/scylladb
)
SYSTEM_EXCLUDES=(
  root/.cache root/.gradle root/.npm root/.nuget root/.local/share/NuGet root/.local/share/kotlin
  root/.local/share/pnpm root/.pm2/logs 'root/commandlinetools-*.zip' node_modules
  usr/local/bin/rclone
)

# home ผู้ใช้: ตัด cache / ของที่ติดตั้งใหม่ได้ (Gradle 6 GB, cache 4.5 GB, tmp 2 GB, venv, android-sdk)
HOME_EXCLUDES=(.cache .npm .gradle .nuget node_modules tmp venvs android-sdk .android/cache .pm2/logs .local/share/Trash .local/share/pnpm)

SITE_EXCLUDES=(
  node_modules .git
  storage/logs storage/framework/cache storage/framework/sessions storage/framework/views storage/debugbar
  main.thaiprompt.online/public_html/backups   # dump ก่อน deploy ของ deploy.sh (7.7 GB, 2026-11-08)
)

# แจ้งเตือน: บอท Telegram แอดมินที่ตั้งในหลังบ้าน Thaiprompt (php artisan alert:telegram)
ALERT_MODE="artisan"
ALERT_APP_USER="admin"
ALERT_PHP="/usr/local/php83/bin/php"
ALERT_ARTISAN="/home/admin/domains/main.thaiprompt.online/public_html/artisan"
