name: Manual Release (Major/Minor)

# Manual trigger only — for major/minor version bumps
# Patch versions are handled automatically by ci.yml auto-release
on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'minor'
        type: choice
        options:
          - minor
          - major

jobs:
  release:
    name: Release (${{ github.event.inputs.version_bump }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current version
        id: current
        run: |
          if [ -f "VERSION" ]; then
            VERSION=$(cat VERSION | tr -d '[:space:]')
          else
            VERSION="0.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📌 Current version: $VERSION"

      - name: Calculate new version
        id: bump
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          BUMP_TYPE="${{ github.event.inputs.version_bump }}"

          # Split version into parts
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          if [ "$BUMP_TYPE" == "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP_TYPE" == "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "📊 Version: $CURRENT → $NEW_VERSION ($BUMP_TYPE)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate changelog entry
        id: changelog
        run: |
          PREVIOUS_TAG="v${{ steps.current.outputs.version }}"
          NEW_TAG="v${{ steps.bump.outputs.new_version }}"
          RELEASE_DATE=$(date +%Y-%m-%d)

          # Generate changelog for GitHub release
          echo "## 📋 What's Changed in ${NEW_TAG}" > CHANGELOG.txt
          echo "" >> CHANGELOG.txt
          echo "**Version:** ${NEW_TAG}" >> CHANGELOG.txt
          echo "**Date:** ${RELEASE_DATE}" >> CHANGELOG.txt
          echo "**Previous:** ${PREVIOUS_TAG}" >> CHANGELOG.txt
          echo "**Bump type:** ${{ github.event.inputs.version_bump }}" >> CHANGELOG.txt
          echo "" >> CHANGELOG.txt

          # Check if previous tag exists
          if git rev-parse "$PREVIOUS_TAG" >/dev/null 2>&1; then
            echo "### ✨ Features" >> CHANGELOG.txt
            git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --grep="^feat" --grep="^feature" >> CHANGELOG.txt 2>/dev/null || true
            echo "" >> CHANGELOG.txt
            echo "" >> CHANGELOG.txt

            echo "### 🐛 Bug Fixes" >> CHANGELOG.txt
            git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --grep="^fix" --grep="^bugfix" --grep="^hotfix" >> CHANGELOG.txt 2>/dev/null || true
            echo "" >> CHANGELOG.txt
            echo "" >> CHANGELOG.txt

            echo "### 🔧 Other Changes" >> CHANGELOG.txt
            git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --invert-grep --grep="^feat" --grep="^feature" --grep="^fix" --grep="^bugfix" --grep="^hotfix" --grep="^chore: bump" --grep="^chore: release" >> CHANGELOG.txt 2>/dev/null || true
            echo "" >> CHANGELOG.txt
          else
            echo "### Changes" >> CHANGELOG.txt
            git log -20 --pretty=format:"- %s (%h)" >> CHANGELOG.txt 2>/dev/null || true
            echo "" >> CHANGELOG.txt
          fi

          cat CHANGELOG.txt

      - name: Update version files
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"

          # Update VERSION file
          echo "$NEW_VERSION" > VERSION

          # Update package.json
          npm version $NEW_VERSION --no-git-tag-version --allow-same-version 2>/dev/null || true

          echo "Updated VERSION and package.json to $NEW_VERSION"

      - name: Update CHANGELOG.md
        run: |
          NEW_TAG="v${{ steps.bump.outputs.new_version }}"
          RELEASE_DATE=$(date +%Y-%m-%d)

          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "Thai Prompt Affiliate Marketing Platform" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi

          # Create entry
          echo "" > NEW_ENTRY.txt
          echo "## [${NEW_TAG}] - ${RELEASE_DATE} (${{ github.event.inputs.version_bump }} release)" >> NEW_ENTRY.txt
          echo "" >> NEW_ENTRY.txt
          cat CHANGELOG.txt | tail -n +6 >> NEW_ENTRY.txt

          # Insert after header
          head -n 3 CHANGELOG.md > TEMP_CHANGELOG.md
          cat NEW_ENTRY.txt >> TEMP_CHANGELOG.md
          tail -n +4 CHANGELOG.md >> TEMP_CHANGELOG.md
          mv TEMP_CHANGELOG.md CHANGELOG.md

          rm -f NEW_ENTRY.txt

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add VERSION package.json CHANGELOG.md
          git add package-lock.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: release v${{ steps.bump.outputs.new_version }} (${{ github.event.inputs.version_bump }}) [skip ci]"

          # Retry logic for push
          MAX_RETRIES=5
          RETRY_COUNT=0
          SLEEP_TIME=2

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Push attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES..."

            git fetch origin main
            git rebase origin/claude/Main || {
              git rebase --abort 2>/dev/null || true
              git pull --no-rebase origin main
            }

            if git push origin HEAD:claude/Main; then
              echo "✅ Push successful!"
              break
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "⚠️ Push failed. Retrying in ${SLEEP_TIME}s..."
                sleep $SLEEP_TIME
                SLEEP_TIME=$((SLEEP_TIME * 2))
              else
                echo "❌ Push failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done

      - name: Create Git Tag
        run: |
          NEW_TAG="v${{ steps.bump.outputs.new_version }}"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "⚠️ Tag $NEW_TAG already exists, skipping"
          else
            git tag -a "$NEW_TAG" -m "Release $NEW_TAG (${{ github.event.inputs.version_bump }})"
            echo "✅ Created tag: $NEW_TAG"
          fi

          # Push tag with retry
          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git push origin "$NEW_TAG"; then
              echo "✅ Tag push successful!"
              break
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              sleep 2
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.new_version }}
          name: Release v${{ steps.bump.outputs.new_version }}
          body_path: CHANGELOG.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "🎉 Released v${{ steps.bump.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Previous:** v${{ steps.current.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**New:** v${{ steps.bump.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** ${{ github.event.inputs.version_bump }}" >> $GITHUB_STEP_SUMMARY
