<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Thaiprompt Ultra App Splash Icon -->
  <defs>
    <linearGradient id="splashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E0E7FF"/>
    </linearGradient>
  </defs>

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#splashGrad)" stroke-width="8" stroke-opacity="0.5"/>

  <!-- Inner Circle Background -->
  <circle cx="256" cy="256" r="160" fill="url(#splashGrad)"/>

  <!-- T Letter -->
  <path d="M 170 180 L 342 180 L 342 215 L 273 215 L 273 340 L 239 340 L 239 215 L 170 215 Z"
        fill="url(#textGrad)"/>

  <!-- Decorative Dots -->
  <circle cx="256" cy="100" r="8" fill="#06B6D4"/>
  <circle cx="256" cy="412" r="8" fill="#EC4899"/>
  <circle cx="100" cy="256" r="8" fill="#8B5CF6"/>
  <circle cx="412" cy="256" r="8" fill="#6366F1"/>
</svg>
