name: Server Maintenance

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Maintenance action to run'
        required: true
        default: 'fix-apache-custombuild'
        type: choice
        options:
          - fix-apache-custombuild
          - custombuild-status
          - restart-apache
          - restart-services
          - custom-command
      custom_command:
        description: 'Custom command (only for "custom-command" action)'
        required: false
        default: ''
      confirm:
        description: 'Type "YES" to confirm destructive actions'
        required: false
        default: ''

jobs:
  maintenance:
    name: Run Maintenance — ${{ inputs.action }}
    runs-on: ubuntu-latest

    steps:
      - name: Validate confirmation for destructive actions
        if: inputs.action == 'fix-apache-custombuild' && inputs.confirm != 'YES'
        run: |
          echo "::error::⚠️ กรุณาพิมพ์ 'YES' ใน confirm field เพื่อยืนยัน"
          echo "Action 'fix-apache-custombuild' จะลบ system Apache packages และ rebuild ผ่าน CustomBuild"
          exit 1

      - name: Run maintenance via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          envs: DEPLOY_DIR
          script: |
            echo "============================================"
            echo "🔧 Server Maintenance — $(date '+%Y-%m-%d %H:%M:%S')"
            echo "🎯 Action: ${{ inputs.action }}"
            echo "👤 User: $(whoami)"
            echo "============================================"
            echo ""

            case "${{ inputs.action }}" in
              fix-apache-custombuild)
                echo "🔧 แก้ไขปัญหา: Package 'apache2-bin' is installed on the system"
                echo "---"
                echo ""

                # ขั้นตอนที่ 1: ตรวจสอบ packages ที่ติดตั้ง
                echo "📋 ขั้นตอนที่ 1: ตรวจสอบ Apache system packages..."
                dpkg -l | grep -i apache2 || echo "ไม่พบ Apache system packages"
                echo ""

                # ขั้นตอนที่ 2: หยุด system Apache (ถ้ากำลังรัน)
                echo "⏹️ ขั้นตอนที่ 2: หยุด system Apache service..."
                sudo systemctl stop apache2 2>/dev/null && echo "✅ หยุด apache2 service แล้ว" || echo "ℹ️ apache2 service ไม่ได้รัน"
                sudo systemctl disable apache2 2>/dev/null && echo "✅ disable apache2 service แล้ว" || echo "ℹ️ ไม่สามารถ disable ได้"
                echo ""

                # ขั้นตอนที่ 3: ลบ system Apache packages
                echo "🗑️ ขั้นตอนที่ 3: ลบ system Apache packages..."
                sudo apt-get remove --purge -y \
                  apache2 \
                  apache2-bin \
                  apache2-data \
                  apache2-utils \
                  apache2-doc \
                  libapache2-mod-* \
                  2>&1 || echo "⚠️ บาง packages อาจไม่มีติดตั้ง"
                echo ""

                # ขั้นตอนที่ 4: ลบ dependencies ที่ไม่ใช้
                echo "🧹 ขั้นตอนที่ 4: ลบ dependencies ที่ไม่จำเป็น..."
                sudo apt-get autoremove -y 2>&1
                sudo apt-get autoclean -y 2>&1
                echo ""

                # ขั้นตอนที่ 5: ตรวจสอบว่าลบสำเร็จ
                echo "✅ ขั้นตอนที่ 5: ตรวจสอบหลังลบ..."
                if dpkg -l 2>/dev/null | grep -q "ii.*apache2-bin"; then
                  echo "❌ ยังมี apache2-bin อยู่! ลองใช้ dpkg --force-remove..."
                  sudo dpkg --force-remove-reinstreq --remove apache2-bin 2>&1 || true
                else
                  echo "✅ ลบ apache2-bin สำเร็จ!"
                fi
                echo ""

                # ขั้นตอนที่ 6: Rebuild Apache ผ่าน CustomBuild
                echo "🔨 ขั้นตอนที่ 6: Rebuild Apache ผ่าน DirectAdmin CustomBuild..."
                CUSTOMBUILD_DIR="/usr/local/directadmin/custombuild"
                if sudo test -d "$CUSTOMBUILD_DIR"; then
                  echo "📦 อัพเดท CustomBuild..."
                  sudo "$CUSTOMBUILD_DIR/build" update 2>&1

                  echo ""
                  echo "🔨 Rebuild Apache..."
                  sudo "$CUSTOMBUILD_DIR/build" apache 2>&1

                  echo ""
                  echo "🔨 Rebuild PHP (recompile with new Apache)..."
                  sudo "$CUSTOMBUILD_DIR/build" php n 2>&1

                  echo ""
                  echo "📋 ตรวจสอบ CustomBuild versions..."
                  sudo "$CUSTOMBUILD_DIR/build" versions 2>&1
                else
                  echo "❌ ไม่พบ CustomBuild directory: $CUSTOMBUILD_DIR"
                  echo "กรุณาตรวจสอบ DirectAdmin installation"
                  exit 1
                fi
                echo ""

                # ขั้นตอนที่ 7: Rewrite configs + Restart services
                echo "🔄 ขั้นตอนที่ 7: Rewrite configs + Restart services..."
                if sudo test -x "$CUSTOMBUILD_DIR/build"; then
                  sudo "$CUSTOMBUILD_DIR/build" rewrite_confs 2>&1
                fi

                # Restart DirectAdmin's Apache (httpd)
                sudo systemctl restart httpd 2>/dev/null && echo "✅ Restart httpd สำเร็จ" || \
                  sudo service httpd restart 2>/dev/null && echo "✅ Restart httpd (service) สำเร็จ" || \
                  echo "⚠️ ไม่สามารถ restart httpd"

                # Restart DirectAdmin
                sudo systemctl restart directadmin 2>/dev/null && echo "✅ Restart directadmin สำเร็จ" || \
                  sudo service directadmin restart 2>/dev/null && echo "✅ Restart directadmin (service) สำเร็จ" || \
                  echo "⚠️ ไม่สามารถ restart directadmin"
                echo ""

                # ขั้นตอนที่ 8: ตรวจสอบ final status
                echo "📊 ขั้นตอนที่ 8: Final Status..."
                echo "--- Apache Version ---"
                /usr/local/apache/bin/httpd -v 2>/dev/null || sudo httpd -v 2>/dev/null || echo "ไม่พบ Apache/httpd"
                echo ""
                echo "--- Service Status ---"
                sudo systemctl is-active httpd 2>/dev/null || echo "httpd: unknown"
                sudo systemctl is-active directadmin 2>/dev/null || echo "directadmin: unknown"
                echo ""
                echo "--- DirectAdmin Apache binary ---"
                ls -la /usr/local/apache/bin/httpd 2>/dev/null || echo "ไม่พบ /usr/local/apache/bin/httpd"
                echo ""
                echo "--- System Apache packages (ควรว่าง) ---"
                dpkg -l 2>/dev/null | grep -i "ii.*apache2" || echo "✅ ไม่มี system Apache packages แล้ว"
                echo ""

                # ตรวจสอบว่าเว็บยังทำงาน
                echo "--- Website Health Check ---"
                HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" http://localhost 2>/dev/null || echo "000")
                if echo "$HTTP_CODE" | grep -qE "200|301|302"; then
                  echo "✅ เว็บไซต์ตอบสนองปกติ (HTTP $HTTP_CODE)"
                else
                  echo "⚠️ HTTP $HTTP_CODE — เว็บไซต์อาจยังไม่พร้อม กรุณารอสักครู่แล้วตรวจสอบอีกครั้ง"
                fi
                ;;

              custombuild-status)
                echo "📋 CustomBuild Status"
                echo "---"
                CUSTOMBUILD_DIR="/usr/local/directadmin/custombuild"
                if sudo test -d "$CUSTOMBUILD_DIR"; then
                  echo "=== Versions ==="
                  sudo "$CUSTOMBUILD_DIR/build" versions 2>&1
                  echo ""
                  echo "=== Options (top 50) ==="
                  sudo "$CUSTOMBUILD_DIR/build" options 2>&1 | head -50
                  echo ""
                  echo "=== Apache System Packages ==="
                  dpkg -l 2>/dev/null | grep -i "ii.*apache2" || echo "✅ ไม่มี system Apache packages (ปกติ)"
                else
                  echo "❌ ไม่พบ CustomBuild directory"
                fi
                ;;

              restart-apache)
                echo "🔄 Restart Apache (DirectAdmin httpd)"
                echo "---"
                sudo systemctl restart httpd 2>/dev/null && echo "✅ Restart httpd สำเร็จ" || \
                  sudo service httpd restart 2>/dev/null && echo "✅ Restart httpd (service) สำเร็จ" || \
                  echo "❌ ไม่สามารถ restart httpd"
                echo ""
                echo "--- Apache Status ---"
                sudo systemctl status httpd 2>/dev/null | head -15 || sudo service httpd status 2>/dev/null | head -15 || echo "status unknown"
                ;;

              restart-services)
                echo "🔄 Restart All Services"
                echo "---"
                echo "Restarting httpd..."
                sudo systemctl restart httpd 2>/dev/null && echo "  ✅ httpd restarted" || echo "  ⚠️ httpd restart failed"
                echo "Restarting php-fpm..."
                sudo systemctl restart php-fpm* 2>/dev/null && echo "  ✅ php-fpm restarted" || echo "  ⚠️ php-fpm restart failed"
                echo "Restarting directadmin..."
                sudo systemctl restart directadmin 2>/dev/null && echo "  ✅ directadmin restarted" || echo "  ⚠️ directadmin restart failed"
                echo "Restarting mysql/mariadb..."
                sudo systemctl restart mysqld 2>/dev/null && echo "  ✅ mysqld restarted" || \
                  sudo systemctl restart mariadb 2>/dev/null && echo "  ✅ mariadb restarted" || \
                  echo "  ⚠️ mysql/mariadb restart failed"
                echo ""
                echo "--- Service Status ---"
                for svc in httpd php-fpm83 php-fpm84 directadmin mysqld mariadb; do
                  STATUS=$(sudo systemctl is-active $svc 2>/dev/null || echo "not-found")
                  if [ "$STATUS" != "not-found" ]; then
                    echo "  $svc: $STATUS"
                  fi
                done
                echo ""
                echo "✅ Restart complete"
                ;;

              custom-command)
                CMD="${{ inputs.custom_command }}"
                if [ -z "$CMD" ]; then
                  echo "❌ ไม่ได้ระบุ custom command"
                  exit 1
                fi
                echo "🔧 Running custom command..."
                echo "Command: $CMD"
                echo "---"
                eval "$CMD" 2>&1
                ;;

              *)
                echo "❌ Unknown action: ${{ inputs.action }}"
                exit 1
                ;;
            esac

            echo ""
            echo "============================================"
            echo "✅ Maintenance complete — $(date '+%Y-%m-%d %H:%M:%S')"
            echo "============================================"

      - name: Maintenance summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "## ✅ Maintenance Successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Maintenance Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Action:** ${{ inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
