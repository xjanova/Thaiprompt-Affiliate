# ค่าของเครื่อง 123.253.62.252 (tpixserver — TPIX chain: validator 4 ตัว + bootnode + Blockscout + nginx rpc1)
# install.sh ต่อท้ายไฟล์นี้ด้วย R2_ACCOUNT_ID แล้ววางเป็น /etc/server-backup-r2/r2.conf
#
# ข้อมูลบล็อกของเชนไม่อยู่ในชุดนี้ — มีระบบของมันเองแล้ว:
#   /etc/cron.d/tpix-chain-backup → /usr/local/sbin/tpix-backup-chain 02:17 ทุกคืน
#   → bucket tpix-chain-backup (gpg, รหัสอยู่ใน /etc/tpix-backup.env ซึ่งอยู่ใน etc.tar ของชุดนี้)
#   ตัวกู้คืน (restore) ดึงชุดนั้นมาวางให้เองในขั้น "ข้อมูลเชน TPIX"

HOST_PROFILE="docker"
R2_BUCKET="thaiprompt-backup"
R2_PREFIX="server-123-253-62-252"

# ทุกคืน: สภาพเครื่อง + home · วันที่ 10/25 เพิ่ม: docker image ที่ build เอง + ฐาน Blockscout
NIGHTLY_COMPONENTS="system homes"
FULL_COMPONENTS="docker"
FULL_DAYS="10 25"

# สภาพเครื่อง: นอกจาก /etc (nginx rpc1/njs, fail2ban, ufw, antix, cron.d, systemd, tpix-*.env)
#  - /opt ทั้งหมด = docker-compose ทุกชุด, genesis, คีย์ validator ทุกตัว (consensus/libp2p), สคริปต์
#    ยกเว้นข้อมูลบล็อก (blockchain/trie — มาจากชุดสำรองเชน) และไฟล์ dump เก่าใน /opt/tpix/backup
#  - /usr/local (tpix-backup-chain, watchdog, antix …), home ของ root, cron
SYSTEM_PATHS=(root var/spool/cron usr/local opt)
SYSTEM_EXCLUDES=(
  'opt/tpix/chain/data/*/blockchain' 'opt/tpix/chain/data/*/trie'
  opt/tpix-bootnode/data/blockchain opt/tpix-bootnode/data/trie
  opt/tpix/backup opt/containerd
  root/.cache node_modules
)
HOME_EXCLUDES=(.cache node_modules 'r2-stage-*')

# docker: image ของเราเอง (Blockscout ที่ build/แพตช์เอง — ดึงจาก registry ไม่ได้)
DOCKER_SAVE_PATTERN='^tpix/'
# ฐานของ Blockscout (index ใหม่จากเชนได้แต่ใช้เวลาหลายชั่วโมง) — "container:ฐาน"
DOCKER_PG_DUMPS=("bsn-db:blockscout" "bsn-db:stats")

# แจ้งเตือน: คาดแดงหลังบ้าน tpix.online (ตัวเดียวกับ watchdog/backup-chain — อ่าน /etc/tpix-watchdog.env)
ALERT_MODE="tpix"
ALERT_TPIX_ENV="/etc/tpix-watchdog.env"
