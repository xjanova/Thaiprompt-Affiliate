<?xml version="1.0" encoding="UTF-8"?>
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
    <!-- Gradient Background -->
    <defs>
        <linearGradient id="splashGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="456" height="456" fill="url(#splashGradient)"/>

    <!-- Logo Circle -->
    <circle cx="228" cy="180" r="80" fill="white" opacity="0.2"/>
    <circle cx="228" cy="180" r="60" fill="white"/>

    <!-- TP Icon -->
    <text x="228" y="210" font-family="Arial, sans-serif" font-size="60" font-weight="bold"
          fill="#3B82F6" text-anchor="middle">TP</text>

    <!-- App Name -->
    <text x="228" y="300" font-family="Arial, sans-serif" font-size="48" font-weight="bold"
          fill="white" text-anchor="middle">Thaiprompt</text>

    <!-- Subtitle -->
    <text x="228" y="340" font-family="Arial, sans-serif" font-size="28"
          fill="white" opacity="0.9" text-anchor="middle">Affiliate System</text>
</svg>
