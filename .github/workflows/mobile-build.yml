# GitHub Actions Workflow สำหรับ Build Mobile App (โฟลเดอร์ thaiprompt/ — Expo SDK 57)
# ใช้ EAS Cloud Build — สั่งรันเองเท่านั้น (ไม่ trigger อัตโนมัติ และไม่ submit ขึ้นสโตร์)
#
# วิธีใช้:
# 1. สร้าง Expo account ที่ https://expo.dev
# 2. สร้าง Access Token ที่ Settings > Access Tokens
# 3. เพิ่ม Token ใน GitHub Secrets ชื่อ EXPO_TOKEN
# 4. Actions > "Mobile App Build" > Run workflow แล้วเลือก platform / profile
#
# หมายเหตุ:
# - keystore / google-services.json / Play service account เก็บใน EAS เท่านั้น (repo เป็น PUBLIC)
# - profile production สร้าง AAB (signed ด้วย EAS managed credentials) — การส่งขึ้น Play ให้ทำเองด้วย `eas submit`

name: 📱 Mobile App Build

on:
  # Manual trigger เท่านั้น
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production

permissions:
  contents: read

env:
  WORKING_DIR: thaiprompt
  # Expo SDK 57 (React Native 0.86) ต้องใช้ Node.js >= 22.13
  NODE_VERSION: '22'

jobs:
  # =====================================================
  # Build Android (APK สำหรับ development/preview, AAB สำหรับ production)
  # =====================================================
  build-android:
    name: 🤖 Build Android
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.platform == 'android' ||
      github.event.inputs.platform == 'all'

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKING_DIR }}/package-lock.json'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔐 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🏗️ Build Android
        env:
          PROFILE: ${{ github.event.inputs.profile }}
        run: |
          echo "Building with profile: $PROFILE"
          eas build --platform android --profile "$PROFILE" --non-interactive --no-wait

      - name: 📤 Get build URL
        if: success()
        run: |
          echo "✅ Build queued on EAS"
          echo "📱 ติดตาม/ดาวน์โหลดไฟล์ได้ที่ Expo dashboard: https://expo.dev"

  # =====================================================
  # Build iOS (ต้องมี Apple Developer Account)
  # =====================================================
  build-ios:
    name: 🍎 Build iOS
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.platform == 'ios' ||
      github.event.inputs.platform == 'all'

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKING_DIR }}/package-lock.json'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔐 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🏗️ Build iOS
        env:
          PROFILE: ${{ github.event.inputs.profile }}
        run: |
          echo "Building with profile: $PROFILE"
          eas build --platform ios --profile "$PROFILE" --non-interactive --no-wait

      - name: 📤 Get build URL
        if: success()
        run: |
          echo "✅ Build queued on EAS"
          echo "📱 ติดตาม/ดาวน์โหลดไฟล์ได้ที่ Expo dashboard: https://expo.dev"
